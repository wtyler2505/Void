<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
      :root { --accent: #00ff9d; }
      body {
        font-family: 'JetBrains Mono', monospace;
        background-color: #050505;
        color: #e0e0e0;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f0f0f; 
      }
      ::-webkit-scrollbar-thumb {
        background: #333; 
        border-radius: 0;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00ff9d; 
      }
      .neon-border {
        box-shadow: 0 0 5px rgba(0, 255, 157, 0.2);
        border: 1px solid rgba(0, 255, 157, 0.3);
      }
      .neon-text {
        text-shadow: 0 0 5px rgba(0, 255, 157, 0.5);
      }
      .neon-pink-border {
        box-shadow: 0 0 5px rgba(255, 0, 255, 0.2);
        border: 1px solid rgba(255, 0, 255, 0.3);
      }

      /* Markdown Preview Styles */
      .markdown-preview h1 { font-size: 1.5em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; color: #00ff9d; }
      .markdown-preview h2 { font-size: 1.25em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; color: #e0e0e0; }
      .markdown-preview h3 { font-size: 1.1em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; }
      .markdown-preview p { margin-bottom: 1em; line-height: 1.6; }
      .markdown-preview ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
      .markdown-preview ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
      .markdown-preview blockquote { border-left: 4px solid #333; padding-left: 1em; font-style: italic; color: #888; margin-bottom: 1em; }
      .markdown-preview code { background: #1a1a1a; padding: 0.2em 0.4em; border-radius: 0; font-family: 'JetBrains Mono', monospace; font-size: 0.9em; color: #00ff9d; }
      .markdown-preview pre { background: #111; padding: 1em; border-radius: 0; overflow-x: auto; margin-bottom: 1em; border: 1px solid #333; }
      .markdown-preview pre code { background: transparent; padding: 0; color: #e0e0e0; }
      .markdown-preview a { color: #00ff9d; text-decoration: underline; }
      .link-card:hover { border-color: #00ff9d !important; background: rgba(0, 255, 157, 0.05); }
      .markdown-preview strong { color: #fff; font-weight: bold; }
    </style>
<!-- Google Drive API Scripts -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
</head>

  </body>
</html>
